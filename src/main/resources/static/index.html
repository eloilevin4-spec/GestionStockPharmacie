<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Officine — Gestion de stock</title>
<style>
  :root {
    --bg: #F6FAF8;
    --panel: #FFFFFF;
    --ink: #16302B;
    --ink-soft: #4B655F;
    --line: #DCE8E3;
    --rx: #2F6F5E;
    --rx-dark: #244F43;
    --amber: #B5711F;
    --amber-bg: #FBF0DF;
    --coral: #B5402F;
    --coral-bg: #FBE7E2;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
  }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 24px 80px; }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
  }

  .mark {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--rx) 50%, var(--rx-dark) 50%);
    flex-shrink: 0;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.25);
  }

  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 26px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 13px;
    margin-top: 2px;
    letter-spacing: 0.02em;
  }

  /* ---------- Alert strip ---------- */
  .alerts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 28px;
  }

  @media (max-width: 640px) { .alerts { grid-template-columns: 1fr; } }

  .alert-card {
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 13px;
  }

  .alert-card.stock { background: var(--amber-bg); border: 1px solid #EAD3AC; }
  .alert-card.expiry { background: var(--coral-bg); border: 1px solid #EBC5BC; }

  .alert-title {
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .alert-card.stock .alert-title { color: var(--amber); }
  .alert-card.expiry .alert-title { color: var(--coral); }

  .alert-list { list-style: none; margin: 0; padding: 0; }
  .alert-list li { padding: 2px 0; color: var(--ink); }
  .alert-empty { color: var(--ink-soft); font-style: italic; }

  /* ---------- Panels ---------- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 20px;
  }

  .panel-title {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 16px;
  }

  /* ---------- Form ---------- */
  form.add-form {
    display: grid;
    grid-template-columns: 2fr 1.2fr 1.2fr 1fr 1fr 1fr 1.3fr auto;
    gap: 10px;
    align-items: end;
  }

  @media (max-width: 900px) {
    form.add-form { grid-template-columns: 1fr 1fr; }
  }

  label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 13px;
    background: #FBFDFC;
    color: var(--ink);
  }
  input:focus { outline: 2px solid var(--rx); outline-offset: 1px; }

  button {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    padding: 9px 14px;
    cursor: pointer;
    transition: transform 0.05s ease;
  }
  button:active { transform: scale(0.97); }

  .btn-primary { background: var(--rx); color: white; }
  .btn-primary:hover { background: var(--rx-dark); }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 5px 10px;
    font-size: 12px;
  }
  .btn-ghost:hover { border-color: var(--rx); color: var(--rx); }

  .btn-danger { color: var(--coral); }
  .btn-danger:hover { border-color: var(--coral); }

  /* ---------- Table ---------- */
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    padding: 0 10px 10px;
    border-bottom: 1px solid var(--line);
  }
  tbody td {
    padding: 12px 10px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
    font-size: 13px;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #FAFCFB; }

  .qty { font-family: var(--mono); font-weight: 600; }

  /* Capsule stock indicator — signature element */
  .capsule {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .capsule-shape {
    width: 20px; height: 10px;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--dot-color, var(--rx)) 50%, #E4EEEA 50%);
    flex-shrink: 0;
  }

  .actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .empty-row td {
    text-align: center;
    color: var(--ink-soft);
    font-style: italic;
    padding: 28px 0;
  }

  .stock-input {
    width: 56px;
    padding: 5px 6px;
    font-size: 12px;
    font-family: var(--mono);
  }

  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: var(--rx-dark);
    color: white;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--coral); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mark"></div>
    <div>
      <h1>Officine — Gestion de stock</h1>
      <div class="subtitle">Suivi des médicaments, alertes de rupture et de péremption</div>
    </div>
  </header>

  <div class="alerts">
    <div class="alert-card stock">
      <div class="alert-title">⚠ Stock sous le seuil</div>
      <ul class="alert-list" id="alerteStock"></ul>
    </div>
    <div class="alert-card expiry">
      <div class="alert-title">⏳ Péremption sous 30 jours</div>
      <ul class="alert-list" id="alerteExpiration"></ul>
    </div>
  </div>

  <div class="panel">
    <h2 class="panel-title">Ajouter un médicament</h2>
    <form class="add-form" id="formAjout">
      <div>
        <label for="nom">Nom</label>
        <input id="nom" required placeholder="Doliprane 1000mg">
      </div>
      <div>
        <label for="categorie">Catégorie</label>
        <input id="categorie" placeholder="Antalgique">
      </div>
      <div>
        <label for="fournisseur">Fournisseur</label>
        <input id="fournisseur" placeholder="Sanofi">
      </div>
      <div>
        <label for="quantiteStock">Stock</label>
        <input id="quantiteStock" type="number" min="0" required value="0">
      </div>
      <div>
        <label for="quantiteMinimale">Seuil min.</label>
        <input id="quantiteMinimale" type="number" min="0" required value="10">
      </div>
      <div>
        <label for="prixUnitaire">Prix (€)</label>
        <input id="prixUnitaire" type="number" step="0.01" min="0" required value="0.00">
      </div>
      <div>
        <label for="dateExpiration">Péremption</label>
        <input id="dateExpiration" type="date" required>
      </div>
      <button type="submit" class="btn-primary">Ajouter</button>
    </form>
  </div>

  <div class="panel">
    <h2 class="panel-title">Inventaire</h2>
    <table>
      <thead>
        <tr>
          <th>Médicament</th>
          <th>Fournisseur</th>
          <th>Stock</th>
          <th>Péremption</th>
          <th>Prix</th>
          <th>Mouvement</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="corpsTable">
        <tr class="empty-row"><td colspan="7">Chargement…</td></tr>
      </tbody>
    </table>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api/medicaments';

function toast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2200);
}

function joursRestants(dateStr) {
  const diff = (new Date(dateStr) - new Date()) / (1000 * 60 * 60 * 24);
  return Math.ceil(diff);
}

async function chargerTout() {
  const [tousRes, stockRes, expRes] = await Promise.all([
    fetch(API),
    fetch(API + '/alertes/stock-faible'),
    fetch(API + '/alertes/expiration?jours=30')
  ]);
  const tous = await tousRes.json();
  const stockFaible = await stockRes.json();
  const expiration = await expRes.json();

  renderAlertes('alerteStock', stockFaible, m => `${m.nom} — ${m.quantiteStock}/${m.quantiteMinimale}`, 'Aucune alerte de stock.');
  renderAlertes('alerteExpiration', expiration, m => `${m.nom} — ${joursRestants(m.dateExpiration)} j restants`, 'Aucune péremption proche.');
  renderTable(tous);
}

function renderAlertes(id, liste, formatFn, vide) {
  const el = document.getElementById(id);
  el.innerHTML = liste.length
    ? liste.map(m => `<li>${formatFn(m)}</li>`).join('')
    : `<li class="alert-empty">${vide}</li>`;
}

function renderTable(liste) {
  const tbody = document.getElementById('corpsTable');
  if (!liste.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="7">Aucun médicament enregistré.</td></tr>';
    return;
  }
  tbody.innerHTML = liste.map(m => {
    const bas = m.quantiteStock <= m.quantiteMinimale;
    const couleur = bas ? 'var(--coral)' : 'var(--rx)';
    return `
    <tr>
      <td>
        <div style="font-weight:600">${m.nom}</div>
        <div style="color:var(--ink-soft);font-size:11px">${m.categorie || ''}</div>
      </td>
      <td>${m.fournisseur || '—'}</td>
      <td>
        <span class="capsule">
          <span class="capsule-shape" style="--dot-color:${couleur}"></span>
          <span class="qty">${m.quantiteStock}</span>
        </span>
      </td>
      <td>${new Date(m.dateExpiration).toLocaleDateString('fr-FR')}</td>
      <td class="qty">${m.prixUnitaire.toFixed(2)} €</td>
      <td>
        <div class="actions">
          <input type="number" class="stock-input" id="qte-${m.id}" placeholder="qté" min="1" value="1">
          <button class="btn-ghost" onclick="mouvement(${m.id}, 'entree')">+ Entrée</button>
          <button class="btn-ghost" onclick="mouvement(${m.id}, 'sortie')">− Sortie</button>
        </div>
      </td>
      <td>
        <button class="btn-ghost btn-danger" onclick="supprimer(${m.id})">Suppr.</button>
      </td>
    </tr>`;
  }).join('');
}

async function mouvement(id, type) {
  const qte = document.getElementById(`qte-${id}`).value || 1;
  const res = await fetch(`${API}/${id}/${type}?quantite=${qte}`, { method: 'POST' });
  if (res.ok) {
    toast(type === 'entree' ? 'Stock réapprovisionné.' : 'Sortie de stock enregistrée.');
    chargerTout();
  } else {
    toast('Opération refusée (stock insuffisant ?).', true);
  }
}

async function supprimer(id) {
  if (!confirm('Supprimer ce médicament ?')) return;
  await fetch(`${API}/${id}`, { method: 'DELETE' });
  toast('Médicament supprimé.');
  chargerTout();
}

document.getElementById('formAjout').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    nom: document.getElementById('nom').value,
    categorie: document.getElementById('categorie').value,
    fournisseur: document.getElementById('fournisseur').value,
    quantiteStock: Number(document.getElementById('quantiteStock').value),
    quantiteMinimale: Number(document.getElementById('quantiteMinimale').value),
    prixUnitaire: Number(document.getElementById('prixUnitaire').value),
    dateExpiration: document.getElementById('dateExpiration').value
  };
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (res.ok) {
    toast('Médicament ajouté.');
    e.target.reset();
    document.getElementById('quantiteMinimale').value = 10;
    document.getElementById('prixUnitaire').value = '0.00';
    chargerTout();
  } else {
    toast('Erreur lors de l\'ajout — vérifiez les champs.', true);
  }
});

chargerTout();
</script>
</body>
</html>
